services:

  # --- HOME-ASSISTANT (home automation hub) ---
  home-assistant:
    labels:
    - homepage.group=Home & Automation
    - homepage.name=Home Assistant
    - homepage.icon=mdi-home-automation
    - homepage.description=Home automation hub
    - homepage.href=https://home-assistant.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["smarthome"]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
    - ${HOME_ASSISTANT_DATA:-../services-data/system/home-assistant}:/config
    - /etc/localtime:/etc/localtime:ro
    - /run/dbus:/run/dbus:ro
    environment:
    - TZ=${TZ:-Europe/Kyiv}

  # --- HOMEBOX (household inventory) ---
  homebox:
    labels:
    - homepage.group=Home & Automation
    - homepage.name=Homebox
    - homepage.icon=mdi-package-variant-closed
    - homepage.description=Household inventory
    - homepage.href=https://inventory.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["smarthome"]
    image: sysadminsmedia/homebox:latest
    container_name: homebox
    restart: unless-stopped
    depends_on:
      homebox-init:
        condition: service_completed_successfully
    env_file:
    - ../services-data/system/homebox/secrets/homebox.env
    environment:
    - HBOX_LOG_LEVEL=info
    - HBOX_LOG_FORMAT=text
    ports:
    - "${HOMEBOX_HOST_PORT:-3100}:7745"
    volumes:
    - ${HOMEBOX_DATA:-../services-data/system/homebox}:/data
    networks:
    - homelab_net

  # --- HOMEBOX INIT (generates HBOX_AUTH_API_KEY_PEPPER once, persists) ---
  homebox-init:
    profiles: ["smarthome"]
    image: alpine:latest
    container_name: homebox-init
    restart: "no"
    command: ["/scripts/homebox-init.sh"]
    volumes:
    - ../services-data/system/homebox/secrets:/secrets
    - ./scripts/homebox-init.sh:/scripts/homebox-init.sh:ro

  # --- NODERED INIT (writes settings.js with admin password) ---
  nodered-init:
    profiles: ["smarthome"]
    image: alpine:latest
    container_name: nodered-init
    restart: "no"
    volumes:
    - ${NODERED_DATA:-../services-data/system/nodered}/settings.js:/settings.js.template:ro
    - ../services-data/system/nodered:/data
    entrypoint: /bin/sh
    command:
    - -c
    - |
      apk add --no-cache gettext >/dev/null
      if [ ! -f /data/settings.js ]; then
        echo "Bootstrapping nodered settings.js..."
        envsubst '$$NODERED_ADMIN_PASS' < /settings.js.template > /data/settings.js
        echo "nodered settings.js created."
      else
        echo "settings.js exists. Skipping."
      fi

  # --- NODERED (automation flows) ---
  nodered:
    profiles: ["smarthome"]
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
    - "${NODERED_HOST_PORT:-1880}:1880"
    volumes:
    - ${NODERED_DATA:-../services-data/system/nodered}:/data
    networks:
    - homelab_net
    depends_on:
      nodered-init:
        condition: service_completed_successfully

  # --- SEAFILE ---
  seafile:
    labels:
    - homepage.group=Home & Automation
    - homepage.name=Seafile
    - homepage.icon=mdi-cloud
    - homepage.description=File sync + share
    - homepage.href=https://cloud.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["smarthome"]
    image: seafileltd/seafile-mc:latest
    container_name: seafile
    restart: unless-stopped
    ports:
      - "${SEAFILE_HOST_PORT:-8084}:80"
    environment:
      - DEBUG=True
      - DB_HOST=seafile-db
      - DB_ROOT_PASSWD=${SEAFILE_DB_ROOT_PASS:-db_dev_password}
      - TIME_ZONE=Europe/Kyiv
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL:-admin@example.com}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASS:-adminpassword}
      - SEAFILE_SERVER_LETSENCRYPT=false
    volumes:
    - ${SEAFILE_DATA:-../services-data/system/seafile}:/shared
    depends_on:
      - seafile-db
      - seafile-memcached
    networks:
      - homelab_net

  seafile-db:
    profiles: ["smarthome"]
    image: mariadb:11.8.8
    container_name: seafile-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASS:-db_dev_password}
      - MYSQL_LOG_CONSOLE=true
      - DEBUG=True
    volumes:
      - ${SEAFILE_DB_DATA:-../services-data/system/seafile-db}:/var/lib/mysql
    networks:
      - homelab_net

  seafile-memcached:
    profiles: ["smarthome"]
    image: memcached:1.6-alpine
    container_name: seafile-memcached
    restart: unless-stopped
    entrypoint: memcached -m 256
    networks:
      - homelab_net

  seafile-auto-config:
    profiles: ["smarthome"]
    image: docker:cli
    container_name: seafile-auto-config
    restart: "no"
    depends_on:
      - seafile
    volumes:
      - ${SEAFILE_DATA_PATH:-../services-data/system/seafile/data}:/shared
      - /var/run/docker.sock:/var/run/docker.sock
    command: |
      /bin/sh -c "
        echo 'Waiting for Seafile to initialize config files...'
        while [ ! -f /shared/seafile/conf/seahub_settings.py ]; do sleep 3; done
        sleep 5
        if ! grep -q 'CSRF_TRUSTED_ORIGINS' /shared/seafile/conf/seahub_settings.py; then
          echo 'Injecting HTTPS and CSRF settings...'
          echo \"\" >> /shared/seafile/conf/seahub_settings.py
          echo \"SERVICE_URL = 'https://cloud.${DUCKDNS_DOMAIN:-your-subdomain.duckdns.org}'\" >> /shared/seafile/conf/seahub_settings.py
          echo \"FILE_SERVER_ROOT = 'https://cloud.${DUCKDNS_DOMAIN:-your-subdomain.duckdns.org}/seafhttp'\" >> /shared/seafile/conf/seahub_settings.py
          echo \"CSRF_TRUSTED_ORIGINS = ['https://cloud.${DUCKDNS_DOMAIN:-your-subdomain.duckdns.org}']\" >> /shared/seafile/conf/seahub_settings.py
          echo \"SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')\" >> /shared/seafile/conf/seahub_settings.py
          echo 'Restarting Seafile container to apply changes...'
          docker restart seafile
        else
          echo 'Custom configurations are already present. Exiting.'
        fi
      "

  # --- MANAGEMEALS ---
  managemeals:
    labels:
    - homepage.group=Home & Automation
    - homepage.name=ManageMeals
    - homepage.icon=mdi-silverware-fork-knife
    - homepage.description=Recipe manager
    - homepage.href=https://recipes.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["smarthome"]
    image: ghcr.io/nightwhistler/managemeals:latest
    container_name: managemeals
    restart: unless-stopped
    environment:
    - ASPNETCORE_ENVIRONMENT=Production
    - ASPNETCORE_URLS=http://+:8089
    ports:
    - "${MANAGEMEALS_PORT:-8089}:8089"
    volumes:
    - ${MANAGEMEALS_DATA:-../services-data/system/managemeals}:/app/data
    networks:
    - homelab_net

  # --- GROCY ---
  grocy:
    labels:
    - homepage.group=Home & Automation
    - homepage.name=Grocy
    - homepage.icon=mdi-home
    - homepage.description=Household inventory + shopping
    - homepage.href=https://grocy.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["smarthome"]
    image: ghcr.io/linuxserver/grocy:latest
    container_name: grocy
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Kyiv}
    - DISABLE_BROWSER_OPEN=true
    ports:
    - "${GROCY_PORT:-9283}:80"
    volumes:
    - ${GROCY_DATA:-../services-data/system/grocy}:/config
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
