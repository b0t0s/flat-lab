services:

  # --- PERPLEXICA ---
  perplexica:
    labels:
    - homepage.group=Productivity
    - homepage.name=Perplexica
    - homepage.icon=mdi-magnify
    - homepage.description=AI search (Perplexity alt)
    - homepage.href=https://perplexica.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["paas"]
    image: itzcrazykns/perplexica:main
    container_name: perplexica
    restart: unless-stopped
    ports:
    - "${PERPLEXICA_PORT:-8061}:3000"
    volumes:
    - ${PERPLEXICA_DATA:-../services-data/system/perplexica}:/home/perplexica/data
    networks:
    - homelab_net

  # --- SUPER-PRODUCTIVITY ---
  super-productivity:
    labels:
    - homepage.group=Productivity
    - homepage.name=Super Productivity
    - homepage.icon=mdi-checkbox-marked-circle-outline
    - homepage.description=Task tracker (Supersync server)
    - homepage.href=https://tasks.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: ghcr.io/super-productivity/supersync:latest
    container_name: super-productivity
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - PORT=1900
    - DATA_DIR=/data
    - RUN_MIGRATIONS_ON_STARTUP=true
    - JWT_SECRET=${SUPERPRODUCTIVITY_SYNC_SECRET}
    - LOG_LEVEL=info
    - CORS_ENABLED=true
    - CORS_ORIGINS=https://tasks.${DUCKDNS_DOMAIN:-localhost}
    - WEBAUTHN_RP_NAME=Super Productivity
    ports:
    - "${SUPERPRODUCTIVITY_PORT:-5050}:1900"
    volumes:
    - ${SUPERPRODUCTIVITY_DATA:-../services-data/system/super-productivity}:/data
    networks:
    - homelab_net

  # --- CAL.COM (scheduling infrastructure, Calendly alternative) ---
  calcom:
    labels:
    - homepage.group=Productivity
    - homepage.name=Cal.com
    - homepage.icon=mdi-calendar
    - homepage.description=Scheduling infrastructure
    - homepage.href=https://cal.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: ghcr.io/calcom/calcom-images:main
    container_name: calcom
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - PORT=80
    - DATABASE_URL=postgresql://cal:${CALCOM_DB_PASSWORD}@calcom-db:5432/calcom
    - REDIS_URL=redis://calcom-redis:6379
    - WEBAPP_URL=https://cal.${DUCKDNS_DOMAIN:-localhost}
    - NEXT_PUBLIC_WEBAPP_URL=https://cal.${DUCKDNS_DOMAIN:-localhost}
    - NEXTAUTH_SECRET=${CALCOM_SECRET}
    - CALENDSO_ENCRYPTION_KEY=${CALCOM_ENCRYPTION_KEY}
    - NEXT_PUBLIC_LICENSE_CONSOLE_URL=
    - EMAIL_SERVER_HOST=disabled
    ports:
    - "${CALCOM_PORT:-8020}:80"
    depends_on:
    - calcom-db
    - calcom-redis
    volumes:
    - ${CALCOM_DATA:-../services-data/system/calcom}:/calcom-data
    networks:
    - homelab_net

  # --- CAL.COM POSTGRES ---
  calcom-db:
    profiles: ["productivity"]
    image: postgres:16-alpine
    container_name: calcom-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=calcom
    - POSTGRES_USER=cal
    - POSTGRES_PASSWORD=${CALCOM_DB_PASSWORD}
    volumes:
    - ${CALCOM_DB_DATA:-../services-data/system/calcom/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- CAL.COM REDIS ---
  calcom-redis:
    profiles: ["productivity"]
    image: redis:7-alpine
    container_name: calcom-redis
    restart: unless-stopped
    networks:
    - homelab_net

  # --- RADICALE (CalDAV/CardDAV server) ---
  radicale:
    labels:
    - homepage.group=Productivity
    - homepage.name=Radicale
    - homepage.icon=mdi-calendar-clock
    - homepage.description=CalDAV/CardDAV server
    - homepage.href=https://dav.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: ghcr.io/kozea/radicale:stable
    container_name: radicale
    restart: unless-stopped
    ports:
    - "${RADICALE_PORT:-5232}:5232"
    volumes:
    - ${RADICALE_CONFIG:-../services-data/system/radicale/config}:/etc/radicale
    - ${RADICALE_DATA:-../services-data/system/radicale/data}:/var/lib/radicale
    networks:
    - homelab_net

  # --- AFFINE ---
  affine:
    labels:
    - homepage.group=Productivity
    - homepage.name=Affine
    - homepage.icon=mdi-notebook
    - homepage.description=Local-first Notion + Miro
    - homepage.href=https://notes.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: ghcr.io/toeverything/affine:stable
    container_name: affine
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - PORT=3010
    - DATABASE_URL=postgres://affine:${AFFINE_DB_PASSWORD}@affine-db:5432/affine
    ports:
    - "${AFFINE_PORT:-3010}:3010"
    depends_on:
    - affine-db
    volumes:
    - ${AFFINE_DATA:-../services-data/system/affine}:/data
    networks:
    - homelab_net

  # --- AFFINE POSTGRES ---
  affine-db:
    profiles: ["productivity"]
    image: postgres:16-alpine
    container_name: affine-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=affine
    - POSTGRES_USER=affine
    - POSTGRES_PASSWORD=${AFFINE_DB_PASSWORD}
    volumes:
    - ${AFFINE_DB_DATA:-../services-data/system/affine/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- MINIFLUX DB (postgres) ---
  miniflux-db:
    profiles: ["productivity"]
    image: postgres:16-alpine
    container_name: miniflux-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=miniflux
    - POSTGRES_USER=miniflux
    - POSTGRES_PASSWORD=${MINIFLUX_DB_PASSWORD}
    volumes:
    - ${MINIFLUX_DB_DATA:-../services-data/system/miniflux/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- MINIFLUX (minimalist feed reader) ---
  miniflux:
    labels:
    - homepage.group=Productivity
    - homepage.name=Miniflux
    - homepage.icon=si-feedly
    - homepage.description=Minimalist feed reader
    - homepage.href=https://rss.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: miniflux/miniflux:latest
    container_name: miniflux
    restart: unless-stopped
    depends_on:
    - miniflux-db
    environment:
    - DATABASE_URL=postgres://miniflux:${MINIFLUX_DB_PASSWORD}@miniflux-db:5432/miniflux?sslmode=disable
    - RUN_MIGRATIONS=1
    - LISTEN_ADDR=:8080
    - BASE_URL=https://rss.${DUCKDNS_DOMAIN:-localhost}
    - FETCHER_ALLOW_PRIVATE_NETWORKS=1
    - CREATE_ADMIN=1
    - ADMIN_USERNAME=${MINIFLUX_ADMIN_USER}
    - ADMIN_PASSWORD=${MINIFLUX_ADMIN_PASSWORD}
    ports:
    - "${MINIFLUX_PORT:-8051}:8080"
    networks:
    - homelab_net

  # --- DOCUMENSO ---
  documenso:
    labels:
    - homepage.group=Productivity
    - homepage.name=Documenso
    - homepage.icon=mdi-signature-freehand
    - homepage.description=Document signing (DocuSign alt)
    - homepage.href=https://sign.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: documenso/documenso:latest
    container_name: documenso
    restart: unless-stopped
    depends_on:
    - documenso-db
    - documenso-redis
    environment:
    - NEXTAUTH_SECRET=${DOCUMENSO_SECRET}
    - NEXTAUTH_URL=https://sign.${DUCKDNS_DOMAIN:-localhost}
    - DATABASE_URL=postgres://documenso:${DOCUMENSO_DB_PASSWORD}@documenso-db:5432/documenso
    - REDIS_URL=redis://documenso-redis:6379
    - PORT=3500
    - NODE_ENV=production
    ports:
    - "${DOCUMENSO_PORT:-3500}:3500"
    volumes:
    - ${DOCUMENSO_DATA:-../services-data/system/documenso}:/data
    networks:
    - homelab_net

  # --- DOCUMENSO POSTGRES ---
  documenso-db:
    profiles: ["productivity"]
    image: postgres:16-alpine
    container_name: documenso-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=documenso
    - POSTGRES_USER=documenso
    - POSTGRES_PASSWORD=${DOCUMENSO_DB_PASSWORD}
    volumes:
    - ${DOCUMENSO_DB_DATA:-../services-data/system/documenso/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- DOCUMENSO REDIS ---
  documenso-redis:
    profiles: ["productivity"]
    image: redis:7-alpine
    container_name: documenso-redis
    restart: unless-stopped
    networks:
    - homelab_net

  # --- DOCUSEAL ---
  docuseal:
    labels:
    - homepage.group=Productivity
    - homepage.name=DocuSeal
    - homepage.icon=mdi-file-sign
    - homepage.description=E-signatures (DocuSign alt)
    - homepage.href=https://esign.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: docuseal/docuseal:latest
    container_name: docuseal
    restart: unless-stopped
    environment:
    - DATABASE_URL=sqlite3:///data/docuseal.sqlite3
    - SECRET_KEY_BASE=${DOCUSEAL_SECRET}
    - HOST=https://esign.${DUCKDNS_DOMAIN:-localhost}
    ports:
    - "${DOCUSEAL_PORT:-3501}:3000"
    volumes:
    - ${DOCUSEAL_DATA:-../services-data/system/docuseal}:/data
    networks:
    - homelab_net

  # --- ACTUAL BUDGET (envelope budgeting) ---
  actualbudget:
    labels:
    - homepage.group=Productivity
    - homepage.name=ActualBudget
    - homepage.icon=mdi-wallet
    - homepage.description=Envelope-budget personal finance
    - homepage.href=https://budget.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: actualbudget/actual-server:latest
    container_name: actualbudget
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    - PORT=5006
    - ACTUAL_USER_FILE=/data/user-files.json
    - ACTUAL_PASSWORD=${ACTUALBUDGET_PASSWORD}
    ports:
    - "${ACTUALBUDGET_PORT:-5006}:5006"
    volumes:
    - ${ACTUALBUDGET_DATA:-../services-data/system/actualbudget}:/data
    networks:
    - homelab_net

  # --- WALLOS (subscription tracker) ---
  wallos:
    labels:
    - homepage.group=Productivity
    - homepage.name=Wallos
    - homepage.icon=mdi-credit-card
    - homepage.description=Subscription tracker
    - homepage.href=https://subs.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: bellamy/wallos:latest
    container_name: wallos
    restart: unless-stopped
    ports:
    - "${WALLOS_PORT:-8087}:80"
    volumes:
    - ${WALLOS_DATA:-../services-data/system/wallos}:/var/www/html/db
    - ${WALLOS_IMAGES:-../services-data/system/wallos/images}:/var/www/html/images/logos/uploads
    networks:
    - homelab_net

  # --- SOLIDTIME (time tracking) ---
  solidtime:
    labels:
    - homepage.group=Productivity
    - homepage.name=Solidtime
    - homepage.icon=mdi-clock-outline
    - homepage.description=Time tracking
    - homepage.href=https://time.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: solidtime/solidtime:latest
    container_name: solidtime
    restart: unless-stopped
    environment:
    - APP_ENV=production
    - APP_DEBUG=false
    - APP_KEY=${SOLIDTIME_APP_KEY}
    - DB_CONNECTION=sqlite
    ports:
    - "${SOLIDTIME_PORT:-8088}:80"
    volumes:
    - ${SOLIDTIME_DATA:-../services-data/system/solidtime}:/var/www/html/database
    networks:
    - homelab_net

  # --- KIMAI ---
  kimai:
    labels:
    - homepage.group=Productivity
    - homepage.name=Kimai
    - homepage.icon=mdi-clock-outline
    - homepage.description=Time tracking + invoicing
    - homepage.href=https://time-kimai.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["productivity"]
    image: kimai/kimai2:latest
    container_name: kimai
    restart: unless-stopped
    environment:
    - APP_ENV=prod
    - TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
    - DATABASE_URL=sqlite:///%kernel.project_dir%/var/data/kimai.sqlite
    ports:
    - "${KIMAI_PORT:-8089}:80"
    volumes:
    - ${KIMAI_DATA:-../services-data/system/kimai}:/opt/kimai/var
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
