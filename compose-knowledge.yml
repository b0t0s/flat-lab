services:

  # --- MEMOS (notes/microblog) ---
  memos:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Memos
    - homepage.icon=mdi-note-multiple
    - homepage.description=Notes + microblog
    - homepage.href=https://memos.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    ports:
    - "${MEMOS_HOST_PORT:-5230}:5230"
    volumes:
    - ${MEMOS_DATA:-../services-data/system/memos}:/var/opt/memos
    networks:
    - homelab_net

  # --- GHOST DB ---
  ghost-db:
    profiles: ["knowledge"]
    image: mysql:8.0
    container_name: ghost-db
    restart: unless-stopped
    environment:
    - MYSQL_ROOT_PASSWORD=${GHOST_DB_ROOT_PASS}
    - MYSQL_DATABASE=ghost
    - MYSQL_USER=ghost
    - MYSQL_PASSWORD=${GHOST_DB_PASS}
    volumes:
    - ${GHOST_DB_DATA:-../services-data/system/ghost-db}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${GHOST_DB_ROOT_PASS}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - homelab_net

  # --- GHOST ---
  ghost:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Ghost
    - homepage.icon=si-ghost
    - homepage.description=Blog / CMS
    - homepage.href=https://blog.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: ghost:5
    container_name: ghost
    restart: unless-stopped
    environment:
    - database__client=mysql
    - database__connection__host=ghost-db
    - database__connection__user=ghost
    - database__connection__password=${GHOST_DB_PASS}
    - database__connection__database=ghost
    - url=https://${DUCKDNS_DOMAIN:-localhost}
    depends_on:
      ghost-db:
        condition: service_healthy
    ports:
    - "${GHOST_HOST_PORT:-2368}:2368"
    volumes:
    - ${GHOST_DATA:-../services-data/system/ghost}:/var/lib/ghost/content
    networks:
    - homelab_net

  # --- CALIBRE-WEB ---
  calibre-web:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Calibre
    - homepage.icon=mdi-book-open-page-variant
    - homepage.description=Book library browser
    - homepage.href=https://books.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Kyiv}
    ports:
    - "${CALIBRE_HOST_PORT:-8083}:8083"
    volumes:
    - ${CALIBRE_DATA:-../services-data/system/calibre-web}:/config
    - ${CALIBRE_LIBRARY:-../services-data/public/books}:/books
    networks:
    - homelab_net

  # --- ARCHIVEBOX ---
  archivebox:
    labels:
    - homepage.group=Knowledge
    - homepage.name=ArchiveBox
    - homepage.icon=mdi-archive
    - homepage.description=Web archiver
    - homepage.href=https://archive.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: archivebox/archivebox:latest
    container_name: archivebox
    restart: unless-stopped
    ports:
    - "${ARCHIVEBOX_HOST_PORT:-8001}:8000"
    environment:
    - ALLOWED_HOSTS=*
    - ADMIN_USERNAME=${ARCHIVEBOX_ADMIN_USER}
    - ADMIN_PASSWORD=${ARCHIVEBOX_ADMIN_PASS}
    volumes:
    - ${ARCHIVEBOX_DATA:-../services-data/system/archivebox}:/data
    networks:
    - homelab_net

  # --- CHANGEDETECTION ---
  changedetection:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=ChangeDetection
    - homepage.icon=mdi-monitor-dashboard
    - homepage.description=Page change detector
    - homepage.href=https://monitor.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: dgtlmoon/changedetection.io:latest
    container_name: changedetection
    restart: unless-stopped
    ports:
    - "${CHANGEDETECTION_HOST_PORT:-5000}:5000"
    volumes:
    - ${CHANGEDETECTION_DATA:-../services-data/system/changedetection}:/datastore
    networks:
    - homelab_net

  # --- DAWARICH ---
  dawarich:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Dawarich
    - homepage.icon=mdi-map-marker-radius
    - homepage.description=Self-hosted location tracking
    - homepage.href=https://locations.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: freikin/dawarich:latest
    container_name: dawarich
    restart: unless-stopped
    environment:
    - RAILS_ENV=production
    - APPLICATION_HOSTS=*
    ports:
    - "${DAWARICH_PORT:-3030}:3000"
    volumes:
    - ${DAWARICH_DATA:-../services-data/system/dawarich}:/usr/src/app/storage
    networks:
    - homelab_net

  # --- ADVENTURELOG ---
  adventurelog:
    labels:
    - homepage.group=Knowledge
    - homepage.name=AdventureLog
    - homepage.icon=mdi-bag-suitcase
    - homepage.description=Travel journal
    - homepage.href=https://travel.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: seanmorley15/adventurelog:latest
    container_name: adventurelog-backend
    restart: unless-stopped
    environment:
    - DJANGO_SETTINGS_MODULE=adventurelog.settings
    - SECRET_KEY=${ADVENTURELOG_SECRET}
    ports:
    - "${ADVENTURELOG_PORT:-8010}:8000"
    volumes:
    - ${ADVENTURELOG_DATA:-../services-data/system/adventurelog}:/app/backend/data
    networks:
    - homelab_net

  # --- FAVED ---
  faved:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Faved
    - homepage.icon=si-pocket
    - homepage.description=Bookmark manager
    - homepage.href=https://faved.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: denho/faved:latest
    container_name: faved
    restart: unless-stopped
    environment:
    - DATA_DIR=/data
    - SECRET_KEY=${FAVED_SECRET}
    ports:
    - "${FAVED_PORT:-4040}:80"
    volumes:
    - ${FAVED_DATA:-../services-data/system/faved}:/data
    networks:
    - homelab_net

  # --- KEILA ---
  keila:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Keila
    - homepage.icon=si-mailgun
    - homepage.description=Newsletter (open-source Mailchimp alt)
    - homepage.href=https://news.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: pentacent/keila:latest
    container_name: keila
    restart: unless-stopped
    environment:
    - PHX_HOST=news.${DUCKDNS_DOMAIN:-localhost}
    - DATABASE_URL=ecto://keila:${KEILA_DB_PASSWORD}@keila-db:5432/keila
    - SECRET_KEY_BASE=${KEILA_SECRET}
    - SMTP_HOST=
    - SMTP_USERNAME=
    - SMTP_PASSWORD=
    ports:
    - "${KEILA_PORT:-4000}:4000"
    depends_on:
    - keila-db
    volumes:
    - ${KEILA_DATA:-../services-data/system/keila}:/app/data
    networks:
    - homelab_net

  # --- KEILA POSTGRES ---
  keila-db:
    profiles: ["knowledge"]
    image: postgres:16-alpine
    container_name: keila-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=keila
    - POSTGRES_USER=keila
    - POSTGRES_PASSWORD=${KEILA_DB_PASSWORD}
    volumes:
    - ${KEILA_DB_DATA:-../services-data/system/keila/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- PAPERLESS REDIS ---
  paperless-redis:
    profiles: ["knowledge"]
    image: redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
    - ${PAPERLESS_REDIS_DATA:-../services-data/system/paperless/redis}:/data
    networks:
    - homelab_net

  # --- PAPERLESS DB ---
  paperless-db:
    profiles: ["knowledge"]
    image: postgres:16-alpine
    container_name: paperless-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=paperless
    - POSTGRES_USER=paperless
    - POSTGRES_PASSWORD=${PAPERLESS_DB_PASSWORD}
    volumes:
    - ${PAPERLESS_DB_DATA:-../services-data/system/paperless/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- PAPERLESS-NGX (document OCR + management) ---
  paperless-ngx:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Paperless-ngx
    - homepage.icon=mdi-file-pdf-box
    - homepage.description=Document manager (OCR + tags)
    - homepage.href=https://paperless.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: ghcr.io/paperlessngx/paperless-ngx:latest
    container_name: paperless-ngx
    restart: unless-stopped
    environment:
    - PAPERLESS_REDIS=redis://paperless-redis:6379
    - PAPERLESS_DBENGINE=postgresql
    - PAPERLESS_DBHOST=paperless-db
    - PAPERLESS_DBNAME=paperless
    - PAPERLESS_DBUSER=paperless
    - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
    - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET}
    - PAPERLESS_TIME_ZONE=${TZ:-Europe/Kyiv}
    - PAPERLESS_URL=https://paperless.${DUCKDNS_DOMAIN:-localhost}
    - USERMAP_UID=${PUID:-1000}
    - USERMAP_GID=${PGID:-1000}
    depends_on:
    - paperless-redis
    - paperless-db
    ports:
    - "${PAPERLESS_PORT:-8002}:8000"
    volumes:
    - ${PAPERLESS_DATA:-../services-data/system/paperless/data}:/usr/src/paperless/data
    - ${PAPERLESS_MEDIA:-../services-data/system/paperless/media}:/usr/src/paperless/media
    - ${PAPERLESS_EXPORT:-../services-data/system/paperless/export}:/usr/src/paperless/export
    - ${PAPERLESS_CONSUME:-../services-data/system/paperless/consume}:/usr/src/paperless/consume
    networks:
    - homelab_net

  # --- OUTLINE (team wiki) ---
  outline:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Outline
    - homepage.icon=mdi-file-document-multiple
    - homepage.description=Team wiki / docs
    - homepage.href=https://docs.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: outlinewiki/outline:latest
    container_name: outline
    restart: unless-stopped
    depends_on:
      outline-db:
        condition: service_healthy
      outline-redis:
        condition: service_healthy
      outline-init:
        condition: service_completed_successfully
    env_file:
    - ../services-data/system/outline/secrets/outline.env
    environment:
    - NODE_ENV=production
    - DATABASE_URL=postgres://outline:${OUTLINE_DB_PASSWORD}@outline-db:5432/outline?sslmode=disable
    - REDIS_URL=redis://outline-redis:6379
    - URL=https://docs.${DUCKDNS_DOMAIN:-localhost}
    - PORT=3000
    - FILE_STORAGE=local
    - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
    ports:
    - "${OUTLINE_PORT:-8060}:3000"
    volumes:
    - ${OUTLINE_DATA:-../services-data/system/outline}:/var/lib/outline/data
    networks:
    - homelab_net

  # --- OUTLINE INIT (generates SECRET_KEY + UTILS_SECRET once, persists) ---
  outline-init:
    profiles: ["knowledge"]
    image: alpine:latest
    container_name: outline-init
    restart: "no"
    command: ["/scripts/outline-init.sh"]
    volumes:
    - ../services-data/system/outline/secrets:/secrets
    - ./scripts/outline-init.sh:/scripts/outline-init.sh:ro

  # --- OUTLINE DB (postgres) ---
  outline-db:
    profiles: ["knowledge"]
    image: postgres:16-alpine
    container_name: outline-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=outline
    - POSTGRES_USER=outline
    - POSTGRES_PASSWORD=${OUTLINE_DB_PASSWORD}
    volumes:
    - ${OUTLINE_DB_DATA:-../services-data/system/outline/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - homelab_net

  # --- OUTLINE REDIS ---
  outline-redis:
    profiles: ["knowledge"]
    image: redis:7-alpine
    container_name: outline-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - homelab_net

  # --- BOOKSTACK (wiki/manual platform) ---
  bookstack:
    labels:
    - homepage.group=Knowledge
    - homepage.name=BookStack
    - homepage.icon=mdi-book-open-variant
    - homepage.description=Self-hosted wiki
    - homepage.href=https://wiki.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: ghcr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    depends_on:
    - bookstack-db
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Kyiv}
    - APP_URL=https://wiki.${DUCKDNS_DOMAIN:-localhost}
    - DB_HOST=bookstack-db
    - DB_PORT=3306
    - DB_DATABASE=bookstack
    - DB_USER=bookstack
    - DB_PASS=${BOOKSTACK_DB_PASSWORD}
    ports:
    - "${BOOKSTACK_PORT:-6875}:80"
    volumes:
    - ${BOOKSTACK_DATA:-../services-data/system/bookstack}:/config
    networks:
    - homelab_net

  # --- BOOKSTACK DB (MariaDB) ---
  bookstack-db:
    profiles: ["knowledge"]
    image: mariadb:11
    container_name: bookstack-db
    restart: unless-stopped
    environment:
    - MARIADB_DATABASE=bookstack
    - MARIADB_USER=bookstack
    - MARIADB_PASSWORD=${BOOKSTACK_DB_PASSWORD}
    - MARIADB_RANDOM_ROOT_PASSWORD=true
    volumes:
    - ${BOOKSTACK_DB_DATA:-../services-data/system/bookstack/db}:/var/lib/mysql
    networks:
    - homelab_net

  # --- SIYUAN NOTE ---
  siyuan:
    labels:
    - homepage.group=Knowledge
    - homepage.name=SiYuan
    - homepage.icon=mdi-notebook
    - homepage.description=Privacy-first note-taking
    - homepage.href=https://siyuan.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: b3log/siyuan:latest
    container_name: siyuan
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Kyiv}
    - SIYUAN_ACCESS_AUTH_CODE_BYPASS=${SIYUAN_ACCESS_AUTH_CODE_BYPASS:-true}
    command:
    - serve
    - --workspace=/siyuan/workspace/
    ports:
    - "${SIYUAN_PORT:-6806}:6806"
    volumes:
    - ${SIYUAN_DATA:-../services-data/system/siyuan}:/siyuan/workspace
    networks:
    - homelab_net

  # --- MEILISEARCH for Linkwarden ---
  linkwarden-meilisearch:
    profiles: ["knowledge"]
    image: getmeili/meilisearch:v1.10
    container_name: linkwarden-meilisearch
    restart: unless-stopped
    environment:
    - MEILI_MASTER_KEY=${LINKWARDEN_MEILI_KEY}
    - MEILI_ENV=production
    volumes:
    - ${LINKWARDEN_MEILI_DATA:-../services-data/system/linkwarden/meilisearch}:/meili_data
    networks:
    - homelab_net

  # --- LINKWARDEN POSTGRES ---
  linkwarden-db:
    profiles: ["knowledge"]
    image: postgres:16-alpine
    container_name: linkwarden-db
    restart: unless-stopped
    environment:
    - POSTGRES_USER=linkwarden
    - POSTGRES_PASSWORD=${LINKWARDEN_DB_PASSWORD}
    - POSTGRES_DB=linkwarden
    volumes:
    - ${LINKWARDEN_DB_DATA:-../services-data/system/linkwarden/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- LINKWARDEN ---
  linkwarden:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Linkwarden
    - homepage.icon=mdi-link-variant
    - homepage.description=Bookmark manager (collaborative)
    - homepage.href=https://links.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: ghcr.io/linkwarden/linkwarden:latest
    container_name: linkwarden
    restart: unless-stopped
    environment:
    - DATABASE_URL=postgresql://linkwarden:${LINKWARDEN_DB_PASSWORD}@linkwarden-db:5432/linkwarden
    - MEILI_HOST=http://linkwarden-meilisearch:7700
    - MEILI_URL=http://linkwarden-meilisearch:7700
    - MEILI_MASTER_KEY=${LINKWARDEN_MEILI_KEY}
    - NEXTAUTH_SECRET=${LINKWARDEN_SECRET}
    - NEXTAUTH_URL=https://links.${DUCKDNS_DOMAIN:-localhost}
    - STORAGE_FOLDER=/data/data
    depends_on:
    - linkwarden-db
    - linkwarden-meilisearch
    ports:
    - "${LINKWARDEN_PORT:-3009}:3000"
    volumes:
    - ${LINKWARDEN_DATA:-../services-data/system/linkwarden/data}/data:/data/data
    networks:
    - homelab_net

  # --- KARAKEEP ---
  karakeep:
    labels:
    - homepage.group=Knowledge
    - homepage.name=Karakeep
    - homepage.icon=mdi-bookmark-multiple
    - homepage.description=Bookmark + read-later
    - homepage.href=https://karakeep.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["knowledge"]
    image: ghcr.io/karakeep-dev/karakeep:latest
    container_name: karakeep
    restart: unless-stopped
    depends_on:
    - karakeep-db
    - karakeep-redis
    - karakeep-meilisearch
    environment:
    - NODE_ENV=production
    - PORT=3000
    - DATABASE_URL=postgres://karakeep:${KARAKEEP_DB_PASSWORD}@karakeep-db:5432/karakeep
    - REDIS_URL=redis://karakeep-redis:6379
    - NEXTAUTH_SECRET=${KARAKEEP_SECRET}
    - NEXTAUTH_URL=https://karakeep.${DUCKDNS_DOMAIN:-localhost}
    - DATA_DIR=/data
    - MEILI_HOST=http://karakeep-meilisearch:7700
    - MEILI_MASTER_KEY=${KARAKEEP_MEILI_KEY}
    ports:
    - "${KARAKEEP_PORT:-3505}:3000"
    networks:
    - homelab_net

  # --- KARAKEEP POSTGRES ---
  karakeep-db:
    profiles: ["knowledge"]
    image: postgres:16-alpine
    container_name: karakeep-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=karakeep
    - POSTGRES_USER=karakeep
    - POSTGRES_PASSWORD=${KARAKEEP_DB_PASSWORD}
    volumes:
    - ${KARAKEEP_DB_DATA:-../services-data/system/karakeep/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- KARAKEEP REDIS ---
  karakeep-redis:
    profiles: ["knowledge"]
    image: redis:7-alpine
    container_name: karakeep-redis
    restart: unless-stopped
    networks:
    - homelab_net

  # --- KARAKEEP MEILISEARCH ---
  karakeep-meilisearch:
    profiles: ["knowledge"]
    image: getmeili/meilisearch:v1.10
    container_name: karakeep-meilisearch
    restart: unless-stopped
    environment:
    - MEILI_MASTER_KEY=${KARAKEEP_MEILI_KEY}
    - MEILI_ENV=production
    volumes:
    - ${KARAKEEP_MEILI_DATA:-../services-data/system/karakeep/meilisearch}:/meili_data
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
