services:

  # --- RSSHUB ---
  rsshub:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=RSSHub
    - homepage.icon=mdi-rss-box
    - homepage.description=RSS feed generator
    - homepage.href=https://feeds.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["monitor"]
    image: diygod/rsshub:latest
    container_name: rsshub
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    ports:
    - "${RSSHUB_PORT:-3503}:1200"
    networks:
    - homelab_net

  # --- UPTIME KUMA ---
  uptime-kuma:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Uptime Kuma
    - homepage.icon=mdi-heart-pulse
    - homepage.description=Uptime monitor
    - homepage.href=https://status.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["monitor"]
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
    - ${UPTIME_KUMA_DATA_PATH:-../services-data/system/uptime-kuma}:/app/data
    - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - "${UPTIME_KUMA_PORT:-3001}:3001"
    networks:
    - homelab_net

  # --- DOZZLE INIT (creates admin user) ---
  dozzle-init:
    profiles: ["monitor"]
    image: docker:cli
    container_name: dozzle-init
    restart: "no"
    depends_on:
      dozzle:
        condition: service_completed_successfully
    volumes:
    - ../services-data/system/dozzle:/data
    entrypoint: /bin/sh
    command:
    - -c
    - |
      if ! docker ps -a --format '{{.Names}}' | grep -q '^dozzle$$'; then
        echo "dozzle container not yet created; skipping user bootstrap."
        exit 0
      fi
      if docker exec dozzle test -f /data/users.yaml; then
        echo "dozzle users.yaml exists. Skipping."
        exit 0
      fi
      echo "Bootstrapping dozzle admin user..."
      docker exec dozzle /dozzle generate "$${DOZZLE_USER}" --email "$${DOZZLE_EMAIL}" --password "$${DOZZLE_PASSWORD}" --name "operator" --role admin
      echo "dozzle admin user created."

  # --- DOZZLE (live container logs) ---
  dozzle:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Dozzle
    - homepage.icon=mdi-text-box-search
    - homepage.description=Container log viewer
    - homepage.href=https://logs.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["monitor"]
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ../services-data/system/dozzle:/data
    ports:
    - "${DOZZLE_PORT:-8888}:8080"
    networks:
    - homelab_net

  # --- NETALERTX ---
  netalertx:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=NetAlertX
    - homepage.icon=mdi-network
    - homepage.description=Network scanner / presence
    - homepage.href=https://netalertx.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["monitor"]
    image: jokobsk/netalertx:latest
    container_name: netalertx
    restart: unless-stopped
    network_mode: host
    privileged: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m
    environment:
    - TZ=${TZ:-Europe/Kyiv}
    - GR_TZ=${TZ:-Europe/Kyiv}
    volumes:
    - ${NETALERTX_DATA_PATH:-../services-data/system/netalertx}:/data
    deploy:
      resources:
        limits:
          memory: 1024M

  # --- GLANCES (system monitor) ---
  glances:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Glances
    - homepage.icon=mdi-monitor-eye
    - homepage.description=System monitor
    - homepage.href=https://glances.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["monitor"]
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    pid: host
    privileged: true
    environment:
    - GLANCES_OPT=-w
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - ${GLANCES_DATA_PATH:-../services-data/system/glances}:/glances/conf
    ports:
    - "${GLANCES_PORT:-61208}:61208"
    networks:
    - homelab_net

  # --- BESZEL HUB ---
  beszel-hub:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Beszel
    - homepage.icon=mdi-server
    - homepage.description=Server metrics hub
    - homepage.href=https://beszel.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["monitor"]
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
    - "${BESZEL_PORT:-8090}:8090"
    volumes:
    - ${BESZEL_DATA:-../services-data/system/beszel}:/beszel_data
    networks:
    - homelab_net

  # --- BESZEL AGENT ---
  beszel-agent:
    profiles: ["monitor"]
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
    - PORT=45876
    - KEY=${BESZEL_AGENT_KEY}

  # --- PLAUSIBLE ---
  plausible-events:
    profiles: ["monitor"]
    image: plausible/events:latest
    container_name: plausible-events
    restart: unless-stopped
    depends_on:
    - plausible-db
    - plausible-clickhouse
    environment:
    - DATABASE_URL=postgres://plausible:${PLAUSIBLE_DB_PASSWORD}@plausible-db:5432/plausible
    - CLICKHOUSE_DATABASE_URL=http://plausible-clickhouse:8123/plausible
    - CLICKHOUSE_USER=plausible
    - CLICKHOUSE_PASSWORD=${PLAUSIBLE_CLICKHO_PASSWORD}
    - SECRET_KEY_BASE=${PLAUSIBLE_SECRET}
    - BASE_URL=https://stats.${DUCKDNS_DOMAIN:-localhost}
    networks:
    - homelab_net

  plausible-db:
    profiles: ["monitor"]
    image: postgres:16-alpine
    container_name: plausible-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=plausible
    - POSTGRES_USER=plausible
    - POSTGRES_PASSWORD=${PLAUSIBLE_DB_PASSWORD}
    volumes:
    - ${PLAUSIBLE_DB_DATA:-../services-data/system/plausible/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  plausible-clickhouse:
    profiles: ["monitor"]
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: plausible-clickhouse
    restart: unless-stopped
    environment:
    - CLICKHOUSE_DB=plausible
    - CLICKHOUSE_USER=plausible
    - CLICKHOUSE_PASSWORD=${PLAUSIBLE_CLICKHO_PASSWORD}
    - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
    - ${PLAUSIBLE_CLICKHOUSE_DATA:-../services-data/system/plausible/clickhouse}:/var/lib/clickhouse
    networks:
    - homelab_net

  plausible:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Plausible
    - homepage.icon=mdi-chart-line
    - homepage.description=Privacy-friendly analytics
    - homepage.href=https://stats.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["monitor"]
    image: plausible/analytics:latest
    container_name: plausible
    restart: unless-stopped
    depends_on:
    - plausible-db
    - plausible-events
    - plausible-clickhouse
    environment:
    - DATABASE_URL=postgres://plausible:${PLAUSIBLE_DB_PASSWORD}@plausible-db:5432/plausible
    - CLICKHOUSE_DATABASE_URL=http://plausible-clickhouse:8123/plausible
    - CLICKHOUSE_USER=plausible
    - CLICKHOUSE_PASSWORD=${PLAUSIBLE_CLICKHO_PASSWORD}
    - SECRET_KEY_BASE=${PLAUSIBLE_SECRET}
    - BASE_URL=https://stats.${DUCKDNS_DOMAIN:-localhost}
    ports:
    - "${PLAUSIBLE_PORT:-3504}:8000"
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
