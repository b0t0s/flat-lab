services:

  # --- HOMEPAGE (dashboard, uses docker socket auto-discovery) ---
  homepage:
    labels:
    - glance.hide=true
    profiles: ["dashboard"]
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
    - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-homepage.${DUCKDNS_DOMAIN:-localhost},dash.${DUCKDNS_DOMAIN:-localhost},localhost,127.0.0.1}
    ports:
    - "${HOMEPAGE_PORT:-3015}:3000"
    volumes:
    - ../services-data/system/homepage/config:/app/config
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - homelab_net

  # --- GLANCE (lightweight dashboard with widgets) ---
  glance:
    profiles: ["dashboard"]
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    depends_on:
      glance-init:
        condition: service_completed_successfully
    ports:
    - "${GLANCE_PORT:-8088}:8080"
    volumes:
    - ../services-data/system/glance/config:/app/config
    - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
    - homelab_net

  # --- GLANCE INIT (regenerates glance.yml from glance-gen.sh on first boot) ---
  glance-init:
    profiles: ["dashboard"]
    image: alpine:latest
    container_name: glance-init
    restart: "no"
    entrypoint: /bin/sh
    command:
    - -c
    - |
      set -eu
      mkdir -p /app/config
      /seed/glance-gen.sh /app/config/glance.yml
    volumes:
    - ../services-data/system/glance/config:/app/config
    - ./scripts/glance-gen.sh:/seed/glance-gen.sh:ro
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
