services:

  # --- SEAFILE MEMCACHED ---
  seafile-memcached:
    profiles: ["paas"]
    image: memcached:1.6-alpine
    container_name: seafile-memcached
    restart: unless-stopped
    entrypoint: memcached -m 256
    networks:
      - homelab_net

  # --- SEAFILE DB ---
  seafile-db:
    profiles: ["paas"]
    image: mariadb:11.8.8
    container_name: seafile-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASS}
      - MYSQL_LOG_CONSOLE=true
    volumes:
      - ${SEAFILE_DB_DATA:-../services-data/system/seafile-db}:/var/lib/mysql
    networks:
      - homelab_net

  # --- SEAFILE AUTO-CONFIG (writes seafile.conf on first run) ---
  seafile-auto-config:
    profiles: ["paas"]
    image: alpine:latest
    container_name: seafile-auto-config
    restart: "no"
    depends_on:
      - seafile-db
      - seafile-memcached
    volumes:
      - ./seafile/seafile.conf.template:/seafile.conf.template:ro
      - ${SEAFILE_DATA:-../services-data/system/seafile}:/seafile-data
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -f /seafile-data/seafile.conf ]; then
          echo "Bootstrapping seafile.conf..."
          envsubst '$$SEAFILE_ADMIN_EMAIL $$SEAFILE_ADMIN_PASS $$SEAFILE_DB_ROOT_PASS' < /seafile.conf.template > /seafile-data/seafile.conf
          echo "seafile.conf created."
        else
          echo "seafile.conf exists. Skipping."
        fi

  # --- SEAFILE ---
  seafile:
    labels:
      - homepage.group=PaaS
      - homepage.name=seafile
      - homepage.icon=seafile
      - homepage.description=File sync + share
      - homepage.href=https://seafile.${DUCKDNS_DOMAIN:-localhost}
      - homepage.target=_blank
    profiles: ["paas"]
    image: seafileltd/seafile-mc:latest
    container_name: seafile
    restart: unless-stopped
    ports:
      - "${SEAFILE_HOST_PORT:-8084}:80"
    volumes:
      - ${SEAFILE_DATA:-../services-data/system/seafile}:/shared
    depends_on:
      - seafile-db
      - seafile-memcached
      - seafile-auto-config
    networks:
      - homelab_net

  # --- OPEN-WEBUI (chat UI for local LLMs) ---
  open-webui:
    labels:
      - homepage.group=PaaS
      - homepage.name=open-webui
      - homepage.icon=openwebui
      - homepage.description=LLM chat UI
      - homepage.href=https://ai.${DUCKDNS_DOMAIN:-localhost}
      - homepage.target=_blank
    profiles: ["paas"]
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_HOST_PORT:-3020}:8080"
    volumes:
      - ${OPEN_WEBUI_DATA:-../services-data/system/open-webui}:/app/backend/data
    networks:
      - homelab_net

  # --- OLLAMA (local LLM runner) ---
  ollama:
    labels:
      - homepage.group=PaaS
      - homepage.name=ollama
      - homepage.icon=ollama
      - homepage.description=Local LLM runner
      - homepage.href=https://ollama.${DUCKDNS_DOMAIN:-localhost}
      - homepage.target=_blank
    profiles: ["paas"]
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${OLLAMA_DATA:-../services-data/system/ollama}:/root/.ollama
    networks:
      - homelab_net

  # --- PHATCRACK DB ---
  phatcrack-db:
    profiles: ["paas"]
    image: postgres:16-alpine
    container_name: phatcrack-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=phatcrack
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=phatcrack
    volumes:
      - ${PHATCRACK_DB_DATA:-../services-data/system/phatcrack-db}:/var/lib/postgresql/data
    networks:
      - homelab_net

  # --- PHATCRACK API ---
  phatcrack-api:
    profiles: ["paas"]
    image: d3vilh/phatcrack-api:latest
    container_name: phatcrack-api
    restart: unless-stopped
    environment:
      - PHATRACK_DB_HOST=phatcrack-db
      - PHATRACK_DB_USER=phatcrack
      - PHATRACK_DB_PASS=${DB_PASS}
      - PHATRACK_DB_NAME=phatcrack
      - PHATRACK_HOST_NAME=${HOST_NAME}
      - PHATRACK_BASE_URL=${BASE_URL}
      - PHATRACK_USER=${PHATCRACK_USER}
    ports:
      - "${PHATCRACK_API_PORT:-8444}:8444"
    depends_on:
      - phatcrack-db
    networks:
      - homelab_net

  # --- PHATCRACK FRONTEND ---
  phatcrack-frontend:
    labels:
      - homepage.group=PaaS
      - homepage.name=phatcrack-frontend
      - homepage.icon=phatcrack
      - homepage.description=Distributed hashcat cracking UI
      - homepage.href=https://phatcrack.${DUCKDNS_DOMAIN:-localhost}
      - homepage.target=_blank
    profiles: ["paas"]
    image: d3vilh/phatcrack-frontend:latest
    container_name: phatcrack-frontend
    restart: unless-stopped
    environment:
      - HOST_NAME=${HOST_NAME}
      - BASE_URL=${BASE_URL}
    ports:
      - "${PHATCRACK_FRONTEND_PORT:-8445}:80"
    depends_on:
      - phatcrack-api
    networks:
      - homelab_net

  # --- MINECRAFT ---
  minecraft:
    labels:
      - homepage.group=PaaS
      - homepage.name=minecraft
      - homepage.icon=minecraft
      - homepage.description=Minecraft Java/Bedrock server. Multi-version, easy config via env.
      - homepage.href=https://minecraft.${DUCKDNS_DOMAIN:-localhost}
      - homepage.target=_blank
    profiles: ["paas"]
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    ports:
      - "${MINECRAFT_PORT:-25565}:25565"
    environment:
      - EULA=TRUE
      - TYPE=PAPER
      - DIFFICULTY=normal
    volumes:
      - ${MINECRAFT_DATA:-../services-data/system/minecraft}:/data
    networks:
      - homelab_net

  # --- PERPLEXICA (AI search / Perplexity clone) ---
  perplexica:
    labels:
      - homepage.group=PaaS
      - homepage.name=perplexica
      - homepage.icon=perplexica
      - homepage.description=AI search (Perplexity clone)
      - homepage.href=https://perplexica.${DUCKDNS_DOMAIN:-localhost}
      - homepage.target=_blank
    profiles: ["paas"]
    image: itzcrazykns/perplexica:main
    container_name: perplexica
    restart: unless-stopped
    ports:
      - "${PERPLEXICA_PORT:-8061}:3000"
    volumes:
      - ${PERPLEXICA_DATA:-../services-data/system/perplexica}:/home/perplexica/data
    networks:
      - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
