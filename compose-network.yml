services:

  # --- ZEROTIER INIT (idempotent local.conf writer) ---
  zerotier-init:
    profiles: ["network"]
    image: alpine:latest
    container_name: zerotier-init
    restart: "no"
    volumes:
    - ${ZEROTIER_DATA_PATH:-../services-data/system/zerotier}:/var/lib/zerotier-one
    entrypoint: /bin/sh
    command:
    - -c
    - |
      if [ ! -f /var/lib/zerotier-one/local.conf ]; then
        echo "Configuring zerotier-one to listen on all interfaces..."
        printf '{"settings":{"tcpListenAddress":"0.0.0.0:9993"}}\n' > /var/lib/zerotier-one/local.conf
        echo "local.conf written."
      else
        echo "local.conf already exists. Skipping."
      fi

  # --- ZEROTIER (mesh VPN) ---
  zerotier:
    build:
      context: ./zerotier
      dockerfile: Dockerfile
    container_name: zerotier
    profiles: ["network"]
    restart: unless-stopped
    labels:
    - glance.hide=true
    cap_add:
    - NET_ADMIN
    - SYS_ADMIN
    devices:
    - /dev/net/tun
    volumes:
    - ${ZEROTIER_DATA_PATH:-../services-data/system/zerotier}:/var/lib/zerotier-one
    environment:
    - ZEROTIER_NETWORK_ID=${ZEROTIER_NETWORK_ID}
    networks:
    - homelab_net
    depends_on:
      zerotier-init:
        condition: service_completed_successfully

  # --- RUSTDESK HBBS (signaling server) ---
  rustdesk-hbbs:
    profiles: ["network"]
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    labels:
    - glance.hide=true
    command: hbbs
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21115:21115"
    - "21116:21116"
    - "21116:21116/udp"
    - "21118:21118"
    networks:
    - homelab_net

  # --- RUSTDESK HBBR (relay server) ---
  rustdesk-hbbr:
    profiles: ["network"]
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    command: hbbr
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21117:21117"
    - "21119:21119"
    networks:
    - homelab_net

  # --- UPSNAP (Wake-on-LAN) ---
  upsnap:
    profiles: ["network"]
    image: ghcr.io/seriousm4x/upsnap:latest
    container_name: upsnap
    restart: unless-stopped
    environment:
    - UPSNAP_HTTP_LISTEN=0.0.0.0:8090
    volumes:
    - ${UPSNAP_DATA_PATH:-../services-data/system/upsnap}:/app/pb_data
    ports:
    - "${UPSNAP_PORT:-8090}:8090"
    networks:
    - homelab_net

  # --- WHOIS (domain/IP lookup service) ---
# --- WHOIS (domain/IP lookup service) ---
  whois:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=Whois
    - homepage.icon=mdi-account-search
    - homepage.description=WHOIS lookup
    - homepage.href=https://whois.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["network"]
    image: ghcr.io/kincaidyang/whois:latest
    container_name: whois
    restart: unless-stopped
    environment:
    - WHOIS_PORT=8043
    - WHOIS_RATE_LIMIT=100
    - WHOIS_LOG_LEVEL=info
    - WHOIS_CACHE_EXPIRATION=3600
    - WHOIS_NEGATIVE_CACHE_EXPIRATION=60
    - WHOIS_REQUIRE_REDIS=false
    - WHOIS_MEMORY_MAX_SIZE=10000
    - WHOIS_MEMORY_CLEAN_INTERVAL=300
    - WHOIS_AUTH_KEYS=${WHOIS_API_KEY}
    ports:
    - "${WHOIS_PORT:-8043}:8043"
    networks:
    - homelab_net

  # --- MYSPEED (speed test history) ---
# --- MYSPEED (speed test history) ---
  myspeed:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=MySpeed
    - homepage.icon=mdi-speedometer
    - homepage.description=Speed test tracker
    - homepage.href=https://speed.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["network"]
    image: gnmyt/myspeed:latest
    container_name: myspeed
    restart: unless-stopped
    ports:
    - "${MYSPEED_PORT:-5216}:5216"
    volumes:
    - ${MYSPEED_DATA_PATH:-../services-data/system/myspeed}:/config
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
