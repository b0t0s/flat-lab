services:

  # --- PRIVATEBIN (zero-knowledge pastebin / encrypted secret sharing) ---
  # Multi-arch (alpine). Replaces shhh, which was amd64-only.
  # Data dir on host must be owned by UID 65534 / GID 82 (the nginx user
  # inside the image) — see chown note in docs.
  privatebin:
    labels:
    - homepage.group=Sharing
    - homepage.name=PrivateBin
    - homepage.icon=mdi-content-paste
    - homepage.description=Zero-knowledge pastebin
    - homepage.href=https://paste.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["secrets"]
    image: privatebin/nginx-fpm-alpine:stable
    container_name: privatebin
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:nodev,noexec,mode=1777
    - /run:nodev,exec,mode=1777
    environment:
    - TZ=${TZ:-Europe/Kyiv}
    - PHP_TZ=${TZ:-Europe/Kyiv}
    ports:
    - "${PRIVATEBIN_PORT:-8082}:8080"
    volumes:
    - ${PRIVATEBIN_DATA:-../services-data/system/privatebin}:/srv/data
    networks:
    - homelab_net

  # --- HEMMELIG (encrypted secret sharing, alternative) ---
  # BROKEN IMAGE — amd64-only, no arm64 manifest.
  # `hemmeligapp/hemmelig:latest` only publishes linux/amd64; Pi 5 is arm64,
  # so Docker pulls fail with `no matching manifest for linux/arm64/v8`.
  # Verified on hub.docker.com: the manifest index lists only `amd64`.
  # Maintainer migrated org to HemmeligOrg/Hemmelig.app but the new image
  # is also amd64-only. No multi-arch alternative exists at this time.
  # Commented out so the TUI sees the service name (with broken status)
  # and operator can decide whether to skip, replace, or run via qemu.
  # Alternative self-hosted secret-sharing tools that ARE multi-arch:
  #   - privatebin (multi-arch, more mature)
  #   - onetimesecret (multi-arch, larger)
  #   - 0x0.st / pasteserver (smaller)
  # hemmelig:
  #   labels:
  #     - homepage.group=Secrets
  #     - homepage.name=hemmelig
  #     - homepage.icon=hemmelig
  #     - homepage.description=Encrypted secret sharing
  #     - homepage.href=https://hemmelig.${DUCKDNS_DOMAIN:-localhost}
  #     - homepage.target=_blank
  #   profiles: ["secrets"]
  #   image: hemmeligapp/hemmelig:latest
  #   container_name: hemmelig
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #   ports:
  #     - "${HEMMELIG_PORT:-5052}:3000"
  #   volumes:
  #     - ${HEMMELIG_DATA:-../services-data/system/hemmelig}:/usr/src/app/data
  #   networks:
  #     - homelab_net

  # --- OPENGIST (pastebin powered by Git) ---
  opengist:
    labels:
    - homepage.group=Sharing
    - homepage.name=Opengist
    - homepage.icon=mdi-source-repository
    - homepage.description=Code snippet pastebin
    - homepage.href=https://gist.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["secrets"]
    image: ghcr.io/thomiceli/opengist:latest
    container_name: opengist
    restart: unless-stopped
    environment:
    - OG_LISTEN_HOST=0.0.0.0
    - OG_LISTEN_PORT=6157
    - OG_REPOSITORY_PATH=/app/repositories
    - OG_SECRET_KEY=${OPENGIST_SECRET}
    ports:
    - "${OPENGIST_PORT:-6157}:6157"
    volumes:
    - ${OPENGIST_DATA:-../services-data/system/opengist}:/app/opengist-data
    - ${OPENGIST_REPOS:-../services-data/system/opengist-repos}:/app/repositories
    networks:
    - homelab_net

  # --- VAULTWARDEN (Bitwarden-compatible password manager) ---
  # Single-container Rust reimplementation of the Bitwarden API. Pi-friendly
  # (under 50 MB RAM idle). Works with all official Bitwarden clients.
  vaultwarden:
    labels:
    - homepage.group=Secrets
    - homepage.name=Vaultwarden
    - homepage.icon=mdi-shield-key
    - homepage.description=Password manager (Bitwarden-compatible)
    - homepage.href=https://vault.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["secrets"]
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
    - DOMAIN=https://vault.${DUCKDNS_DOMAIN:-localhost}
    - SIGNUPS_ALLOWED=false
    - INVITATIONS_ALLOWED=true
    - SHOW_PASSWORD_HINT=false
    - LOG_LEVEL=info
    - LOG_TIMESTAMP=true
    - ROCKET_PORT=80
    - ROCKET_ADDRESS=0.0.0.0
    - WEBSOCKET_ENABLED=true
    - DISABLE_ADMIN_TOKEN=true
    - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    - ROCKET_WORKERS=4
    ports:
    - "${VAULTWARDEN_PORT:-8080}:80"
    volumes:
    - ${VAULTWARDEN_DATA:-../services-data/system/vaultwarden}:/data
    networks:
    - homelab_net

  # --- PASSBOLT CE (team password manager with GPG encryption) ---
  # PHP + MariaDB. Heavier than Vaultwarden but built for team credential
  # sharing with OpenPGP, role-based access, and audit logs.
  passbolt:
    labels:
    - homepage.group=Secrets
    - homepage.name=Passbolt
    - homepage.icon=mdi-key
    - homepage.description=Team password manager
    - homepage.href=https://pass.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["secrets"]
    image: passbolt/passbolt:latest
    container_name: passbolt
    restart: unless-stopped
    depends_on:
    - passbolt-db
    environment:
    - APP_FULL_BASE_URL=https://pass.${DUCKDNS_DOMAIN:-localhost}
    - DATASOURCES_DEFAULT_HOST=passbolt-db
    - DATASOURCES_DEFAULT_PORT=3306
    - DATASOURCES_DEFAULT_DATABASE=passbolt
    - DATASOURCES_DEFAULT_USERNAME=passbolt
    - DATASOURCES_DEFAULT_PASSWORD=${PASSBOLT_DB_PASSWORD}
    - EMAIL_DEFAULT_FROM=admin@${DUCKDNS_DOMAIN:-localhost}
    - EMAIL_TRANSPORT_DEFAULT_HOST=
    - EMAIL_TRANSPORT_DEFAULT_PORT=
    ports:
    - "${PASSBOLT_PORT:-8081}:80"
    networks:
    - homelab_net

  # --- PASSBOLT DB (MariaDB) ---
  passbolt-db:
    profiles: ["secrets"]
    image: mariadb:11
    container_name: passbolt-db
    restart: unless-stopped
    environment:
    - MARIADB_DATABASE=passbolt
    - MARIADB_USER=passbolt
    - MARIADB_PASSWORD=${PASSBOLT_DB_PASSWORD}
    - MARIADB_RANDOM_ROOT_PASSWORD=true
    volumes:
    - ${PASSBOLT_DB_DATA:-../services-data/system/passbolt/db}:/var/lib/mysql
    networks:
    - homelab_net

  # --- ALIASVAULT (privacy-first password manager + email aliasing) ---
  # 2026 entrant. End-to-end encrypted. Built-in email alias generator.
  aliasvault:
    labels:
    - homepage.group=Secrets
    - homepage.name=AliasVault
    - homepage.icon=mdi-email-alert
    - homepage.description=Email alias manager
    - homepage.href=https://alias.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["secrets"]
    image: aliasvault/aliasvault:latest
    container_name: aliasvault
    restart: unless-stopped
    environment:
    - PUBLIC_URL=https://alias.${DUCKDNS_DOMAIN:-localhost}
    ports:
    - "${ALIASVAULT_PORT:-8282}:80"
    volumes:
    - ${ALIASVAULT_DATA:-../services-data/system/aliasvault}:/app/data
    networks:
    - homelab_net

  # --- PSONO (enterprise password + secret sharing) ---
  # Apache-2.0. Supports team vault sharing and offline client sync.
  psono-server:
    profiles: ["secrets"]
    image: psono/psono-server:latest
    container_name: psono-server
    restart: unless-stopped
    depends_on:
    - psono-db
    environment:
    - DEBUG=False
    - ALLOWED_HOSTS=psono.${DUCKDNS_DOMAIN:-localhost}
    - DB_TYPE=mysql
    - DB_HOST=psono-db
    - DB_NAME=psono
    - DB_USER=psono
    - DB_PASSWORD=${PSONO_DB_PASSWORD}
    - SECRET_KEY=${PSONO_SECRET}
    - EMAIL_URL=
    ports:
    - "${PSONO_PORT:-8888}:80"
    volumes:
    - ${PSONO_DATA:-../services-data/system/psono}:/data
    networks:
    - homelab_net

  # --- PSONO DB (MariaDB) ---
  psono-db:
    profiles: ["secrets"]
    image: mariadb:11
    container_name: psono-db
    restart: unless-stopped
    environment:
    - MARIADB_DATABASE=psono
    - MARIADB_USER=psono
    - MARIADB_PASSWORD=${PSONO_DB_PASSWORD}
    - MARIADB_RANDOM_ROOT_PASSWORD=true
    volumes:
    - ${PSONO_DB_DATA:-../services-data/system/psono/db}:/var/lib/mysql
    networks:
    - homelab_net

  # --- INFISICAL (developer secrets management) ---
  # Modern self-hostable alternative to HashiCorp Vault / Doppler.
  # Secrets, dynamic creds, PKI, secret scanning. Apache-2.0.
  infisical:
    labels:
    - homepage.group=Secrets
    - homepage.name=Infisical
    - homepage.icon=mdi-key-variant
    - homepage.description=Secrets manager
    - homepage.href=https://secrets.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["secrets"]
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    depends_on:
    - infisical-db
    - infisical-redis
    environment:
    - SITE_URL=https://secrets.${DUCKDNS_DOMAIN:-localhost}
    - DB_CONNECTION_URI=postgres://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
    - REDIS_URL=redis://infisical-redis:6379
    - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
    - JWT_SIGNUP_SECRET=${INFISICAL_JWT_SECRET}
    - JWT_REFRESH_SECRET=${INFISICAL_JWT_REFRESH_SECRET}
    - SMTP_HOST=
    - SMTP_PORT=
    ports:
    - "${INFISICAL_PORT:-8088}:80"
    networks:
    - homelab_net

  # --- INFISICAL DB (postgres) ---
  infisical-db:
    profiles: ["secrets"]
    image: postgres:16-alpine
    container_name: infisical-db
    restart: unless-stopped
    environment:
    - POSTGRES_DB=infisical
    - POSTGRES_USER=infisical
    - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
    volumes:
    - ${INFISICAL_DB_DATA:-../services-data/system/infisical/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- INFISICAL REDIS ---
  infisical-redis:
    profiles: ["secrets"]
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
