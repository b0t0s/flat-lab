services:

  # --- METUBE ---
  metube:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=MeTube
    - homepage.icon=mdi-youtube
    - homepage.description=YouTube downloader
    - homepage.href=https://metube.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    dns:
    - "${DNS1:-}"
    - "${DNS2:-}"
    ports:
    - "${METUBE_HOST_PORT:-8091}:8081"
    volumes:
    - ${METUBE_DATA:-../services-data/public/}:/downloads
    networks:
    - homelab_net

  # --- NAVIDROME ---
  navidrome:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=Navidrome
    - homepage.icon=mdi-music
    - homepage.description=Music streaming (Spotify alt)
    - homepage.href=https://music.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
    - "${NAVIDROME_HOST_PORT:-4533}:4533"
    environment:
    - ND_SCANSCHEDULE=1h
    - ND_LOGLEVEL=info
    - ND_BASEURL=/
    - ND_MUSICFOLDER=/music
    volumes:
    - ${NAVIDROME_DATA:-../services-data/system/navidrome}:/data
    - ${NAVIDROME_MUSIC:-../services-data/public/music}:/music:ro
    networks:
    - homelab_net

  # --- JELLYFIN ---
  jellyfin:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=Jellyfin
    - homepage.icon=mdi-play-circle
    - homepage.description=Movies + TV streaming
    - homepage.href=https://media.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
    - "8096:8096"
    volumes:
    - ${JELLYFIN_CONFIG:-../services-data/system/jellyfin/config}:/config
    - ${JELLYFIN_CACHE:-../services-data/system/jellyfin/cache}:/cache
    - ${MEDIA_FOLDERS:-../services-data/public/movies}:/media:ro
    networks:
    - homelab_net

  # --- KAVITA ---
  kavita:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=Kavita
    - homepage.icon=mdi-book-multiple
    - homepage.description=Manga / books reader
    - homepage.href=https://manga.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: jvmilazz0/kavita:latest
    container_name: kavita
    restart: unless-stopped
    environment:
    - TZ=${TZ:-Europe/Kyiv}
    ports:
    - "${KAVITA_HOST_PORT:-5002}:5000"
    volumes:
    - ${KAVITA_DATA:-../services-data/system/kavita}:/kavita/config
    - ${KAVITA_LIBRARY:-../services-data/public/books}:/books:ro
    - ${KAVITA_MANGA:-../services-data/public/manga}:/manga:ro
    networks:
    - homelab_net

  # --- QBITTORRENT ---
  qbittorrent:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=qBittorrent
    - homepage.icon=mdi-magnet
    - homepage.description=Torrent client
    - homepage.href=https://torrent.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Kyiv}
    - WEBUI_PORT=8080
    - TORRENTING_PORT=${QBITTORRENT_TORRENT_PORT:-6881}
    ports:
    - "${QBITTORRENT_WEB_PORT:-8080}:8080"
    - "${QBITTORRENT_TORRENT_PORT:-6881}:6881"
    - "${QBITTORRENT_TORRENT_PORT:-6881}:6881/udp"
    volumes:
    - ${QBITTORRENT_CONFIG:-../services-data/system/qbittorrent/config}:/config
    - ${DOWNLOADS_PATH:-../services-data/public/downloads}:/downloads
    networks:
    - homelab_net

  # --- PROWLARR ---
  prowlarr:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=Prowlarr
    - homepage.icon=mdi-magnify
    - homepage.description=Indexer manager
    - homepage.href=https://indexer.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Kyiv}
    ports:
    - "${PROWLARR_HOST_PORT:-9696}:9696"
    volumes:
    - ${PROWLARR_DATA:-../services-data/system/prowlarr}:/config
    networks:
    - homelab_net

  # --- RADARR ---
  radarr:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=Radarr
    - homepage.icon=mdi-movie
    - homepage.description=Movie library manager
    - homepage.href=https://radarr.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Kyiv}
    ports:
    - "${RADARR_HOST_PORT:-7878}:7878"
    volumes:
    - ${RADARR_DATA:-../services-data/system/radarr}:/config
    - ${DOWNLOADS_PATH:-../services-data/public/downloads}:/downloads
    - ${MEDIA_FOLDERS:-../services-data/public/movies}:/movies:rw
    networks:
    - homelab_net

  # --- SONARR ---
  sonarr:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=Sonarr
    - homepage.icon=mdi-television
    - homepage.description=TV library manager
    - homepage.href=https://sonarr.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
    - PUID=${PUID:-1000}
    - PGID=${PGID:-1000}
    - TZ=${TZ:-Europe/Kyiv}
    ports:
    - "${SONARR_HOST_PORT:-8989}:8989"
    volumes:
    - ${SONARR_DATA:-../services-data/system/sonarr}:/config
    - ${DOWNLOADS_PATH:-../services-data/public/downloads}:/downloads
    - ${MEDIA_FOLDERS:-../services-data/public/movies}:/tv:rw
    networks:
    - homelab_net

  # --- PIGALLERY2 ---
  pigallery2:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=PiGallery2
    - homepage.icon=mdi-image-multiple
    - homepage.description=Photo gallery
    - homepage.href=https://gallery.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: bpatrik/pigallery2:latest
    container_name: pigallery2
    restart: unless-stopped
    environment:
    - NODE_ENV=production
    ports:
    - "${PIGALLERY2_PORT:-8089}:80"
    volumes:
    - ${PIGALLERY2_DATA:-../services-data/system/pigallery2/config}:/app/data/config
    - ${PIGALLERY2_PHOTOS:-../services-data/public/photos}:/app/data/photos:ro
    networks:
    - homelab_net

  # --- IMMICH REDIS ---
  immich-redis:
    profiles: ["media"]
    image: redis:7-alpine
    container_name: immich-redis
    restart: unless-stopped
    volumes:
    - ${IMMICH_REDIS_DATA:-../services-data/system/immich/redis}:/data
    networks:
    - homelab_net

  # --- IMMICH POSTGRES ---
  immich-postgres:
    profiles: ["media"]
    image: ghcr.io/immich-app/postgres:16-vectorchord0.5.3-pgvector0.8.1
    container_name: immich-postgres
    restart: unless-stopped
    environment:
    - POSTGRES_USER=immich
    - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
    - POSTGRES_DB=immich
    volumes:
    - ${IMMICH_PG_DATA:-../services-data/system/immich/postgres}:/var/lib/postgresql/data
    networks:
    - homelab_net

  # --- IMMICH TYPESENSE ---
  immich-typesense:
    profiles: ["media"]
    image: typesense/typesense:27.1
    container_name: immich-typesense
    restart: unless-stopped
    environment:
    - TYPESENSE_API_KEY=${IMMICH_TYPESENSE_KEY}
    - TYPESENSE_DATA_DIR=/data
    volumes:
    - ${IMMICH_TYPESENSE_DATA:-../services-data/system/immich/typesense}:/data
    networks:
    - homelab_net

  # --- IMMICH MACHINE LEARNING (disabled; IMMICH_NO_MACHINE_LEARNING=true on server) ---
  # Block kept commented for reference. ML model is heavy on Pi 5.
  # To re-enable: uncomment, set IMMICH_NO_MACHINE_LEARNING=false on immich-server, add immich-machine-learning back to depends_on.
  # immich-machine-learning:
  #   profiles: ["photos"]
  #   image: ghcr.io/immich-app/immich-machine-learning:release
  #   container_name: immich-machine-learning
  #   restart: unless-stopped
  #   volumes:
  #     - ${IMMICH_MODEL_CACHE:-../services-data/system/immich/model-cache}:/cache
  #   networks:
  #     - homelab_net

  # --- IMMICH SERVER ---
  immich-server:
    labels:
    - homepage.group=Media & Entertainment
    - homepage.name=Immich
    - homepage.icon=mdi-image-multiple
    - homepage.description=Photo & video backup
    - homepage.href=https://photos.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["media"]
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    environment:
    - DB_HOSTNAME=immich-postgres
    - DB_USERNAME=immich
    - DB_PASSWORD=${IMMICH_DB_PASSWORD}
    - DB_DATABASE_NAME=immich
    - REDIS_HOSTNAME=immich-redis
    - TYPESENSE_API_KEY=${IMMICH_TYPESENSE_KEY}
    - TYPESENSE_HOST=immich-typesense
    - IMMICH_NO_MACHINE_LEARNING=true
    depends_on:
    - immich-redis
    - immich-postgres
    - immich-typesense
    ports:
    - "${IMMICH_PORT:-2283}:2283"
    volumes:
    - ${IMMICH_EXTERNAL_LOCATION}:/mnt/external-storage
    - ${IMMICH_UPLOAD:-../services-data/public/photos}:/usr/src/app/upload
    - ${IMMICH_DATA:-../services-data/system/immich/config}:/usr/src/app/config
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
