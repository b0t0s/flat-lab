services:

  # --- AUTOMATIC DOCKER PRUNER ---
  docker-pruner:
    profiles: ["system"]
    image: docker:cli
    container_name: docker-pruner
    restart: unless-stopped
    labels:
    - glance.hide=true
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    command: /bin/sh -c "while true; do sleep 86400; echo 'Starting daily prune...'; docker system prune -af --filter 'until=24h'; docker builder prune -af; echo 'Prune complete.'; done"

  # --- ZEROTIER INIT ---
  zerotier-init:
    profiles: ["system"]
    image: alpine:latest
    container_name: zerotier-init
    restart: "no"
    volumes:
    - ${ZEROTIER_DATA_PATH:-../services-data/system/zerotier}:/var/lib/zerotier-one
    entrypoint: /bin/sh
    command:
    - -c
    - |
      if [ ! -f /var/lib/zerotier-one/local.conf ]; then
        echo "Configuring zerotier-one to listen on all interfaces..."
        printf '{"settings":{"tcpListenAddress":"0.0.0.0:9993"}}\n' > /var/lib/zerotier-one/local.conf
        echo "local.conf written."
      else
        echo "local.conf already exists. Skipping."
      fi

  # --- ZEROTIER ---
  zerotier:
    build:
      context: ./zerotier
      dockerfile: Dockerfile
    container_name: zerotier
    profiles: ["system"]
    restart: unless-stopped
    labels:
    - glance.hide=true
    cap_add:
    - NET_ADMIN
    - SYS_ADMIN
    devices:
    - /dev/net/tun
    volumes:
    - ${ZEROTIER_DATA_PATH:-../services-data/system/zerotier}:/var/lib/zerotier-one
    environment:
    - ZEROTIER_NETWORK_ID=${ZEROTIER_NETWORK_ID}
    networks:
    - homelab_net
    depends_on:
      zerotier-init:
        condition: service_completed_successfully

  # --- GLOBAL REVERSE PROXY ---
  caddy:
    labels:
    - glance.hide=true
    profiles: ["system"]
    build:
      context: ./caddy
      dockerfile: Dockerfile
    container_name: caddy_gateway
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    environment:
    - DUCKDNS_TOKEN=${DUCKDNS_TOKEN:-your_duckdns_token_here}
    - DUCKDNS_DOMAIN=${DUCKDNS_DOMAIN:-your-subdomain.duckdns.org}
    volumes:
    - ./caddy/Caddyfile:/etc/caddy/Caddyfile
    - ../services-data/system/caddy/data:/data
    - ../services-data/system/caddy/config:/config
    networks:
    - homelab_net
    extra_hosts:
    - "host.docker.internal:host-gateway"

  # --- ADGUARD HOME ---
  adguardhome:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=AdGuard
    - homepage.icon=mdi-shield-check
    - homepage.description=DNS sinkhole + ad blocker
    - homepage.href=https://adguard.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["system"]
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
    - ${ADGUARD_WORKDIR:-../services-data/system/adguardhome/workdir}:/opt/adguardhome/work
    - ${ADGUARD_CONFDIR:-../services-data/system/adguardhome/confdir}:/opt/adguardhome/conf
    ports:
    - "${ADGUARD_DNS_TCP_PORT:-53}:53/tcp"
    - "${ADGUARD_DNS_UDP_PORT:-53}:53/udp"
    - "${ADGUARD_HTTP_PORT:-81}:81/tcp"
    - "${ADGUARD_WEB_PORT:-3000}:3000/tcp"
    networks:
    - homelab_net
    deploy:
      resources:
        limits:
          memory: 512M

  # --- FILEBROWSER QUANTUM ---
  filebrowser-quantum:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=FileBrowser
    - homepage.icon=si-filebrowser
    - homepage.description=Web file manager
    - homepage.href=https://files.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["system"]
    image: gtstef/filebrowser:1.3.3-stable
    container_name: filebrowser-quantum
    restart: unless-stopped
    environment:
    - FB_BASEURL=/
    ports:
    - "${FILEBROWSER_QUANTUM_PORT:-8090}:80"
    volumes:
    - ${FILEBROWSER_DATA:-../services-data/system/filebrowser-quantum}:/config
    - ${FILEBROWSER_FILES:-../services-data/public}:/srv
    networks:
    - homelab_net

  # --- OLLAMA ---
  ollama:
    profiles: ["system"]
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    labels:
    - glance.hide=true
    environment:
    - OLLAMA_ORIGINS=*
    - OLLAMA_HOST=0.0.0.0
    - OLLAMA_KEEP_ALIVE=24h
    - OLLAMA_API_KEY=${OLLAMA_API_KEY:-localhost}
    ports:
    - "11434:11434"
    volumes:
    - ${OLLAMA_DATA:-../services-data/system/ollama}:/root/.ollama
    networks:
    - homelab_net

  # --- FLARESOLVERR ---
  flaresolverr:
    profiles: ["system"]
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
    - LOG_LEVEL=info
    ports:
    - "${FLARESOLVERR_PORT:-8191}:8191"
    networks:
    - homelab_net

  # --- WATCHTOWER ---
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    profiles: ["system"]
    restart: unless-stopped
    labels:
    - glance.hide=true
    command: --cleanup --schedule "0 0 4 * * *" --label-enable
    environment:
    - DOCKER_API_VERSION=1.40
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    networks:
    - homelab_net

  # --- RUSTDESK HBBS ---
  rustdesk-hbbs:
    profiles: ["system"]
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    restart: unless-stopped
    labels:
    - glance.hide=true
    command: hbbs
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21115:21115"
    - "21116:21116"
    - "21116:21116/udp"
    - "21118:21118"
    networks:
    - homelab_net

  # --- RUSTDESK HBBR ---
  rustdesk-hbbr:
    profiles: ["system"]
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    restart: unless-stopped
    command: hbbr
    volumes:
    - ${RUSTDESK_DATA_PATH:-../services-data/system/rustdesk}:/root
    ports:
    - "21117:21117"
    - "21119:21119"
    networks:
    - homelab_net

  # --- UPSNAP ---
  upsnap:
    profiles: ["system"]
    image: ghcr.io/seriousm4x/upsnap:latest
    container_name: upsnap
    restart: unless-stopped
    environment:
    - UPSNAP_HTTP_LISTEN=0.0.0.0:8090
    volumes:
    - ${UPSNAP_DATA_PATH:-../services-data/system/upsnap}:/app/pb_data
    ports:
    - "${UPSNAP_PORT:-8090}:8090"
    networks:
    - homelab_net

  # --- NTFY ---
  ntfy:
    labels:
    - homepage.group=Infrastructure
    - homepage.name=ntfy
    - homepage.icon=mdi-bell-ring
    - homepage.description=Notification pub/sub
    - homepage.href=https://ntfy.${DUCKDNS_DOMAIN:-localhost}
    profiles: ["system"]
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
    - TZ=${TZ:-Europe/Kyiv}
    - NTFY_BASE_URL=https://ntfy.${DUCKDNS_DOMAIN:-localhost}
    - NTFY_AUTH_DEFAULT_ACCESS=deny-all
    - NTFY_ENABLE_LOGIN=true
    - NTFY_BEHIND_PROXY=true
    volumes:
    - ${NTFY_CACHE:-../services-data/system/ntfy/cache}:/var/cache/ntfy
    - ${NTFY_AUTH:-../services-data/system/ntfy/auth}:/var/lib/ntfy
    - ${NTFY_CONFIG:-../services-data/system/ntfy/config}:/etc/ntfy
    ports:
    - "${NTFY_PORT:-2586}:80"
    networks:
    - homelab_net

  # --- MINECRAFT ---
  minecraft:
    profiles: ["system"]
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped
    labels:
    - glance.hide=true
    ports:
    - "${MINECRAFT_PORT:-25565}:25565"
    environment:
    - EULA=TRUE
    - TYPE=PAPER
    - DIFFICULTY=normal
    volumes:
    - ${MINECRAFT_DATA:-../services-data/system/minecraft}:/data
    networks:
    - homelab_net

networks:
  homelab_net:
    name: homelab_net
    external: true
